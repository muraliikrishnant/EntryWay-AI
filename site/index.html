<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EntryWay — Job Matches</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-bg: #eff4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8e9ec;
      --muted: #9aa1ac;
      --border: #2a2e37;
      --accent: #6ea8fe;
      --accent-bg: #17233d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 1.5rem 1.25rem 0.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  .tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin: 1rem 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
  }
  .tab {
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .empty {
    color: var(--muted);
    padding: 2rem 1rem;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tr:last-child td { border-bottom: none; }
  .score { font-weight: 700; }
  .score.high { color: #16a34a; }
  .score.mid { color: #d97706; }
  .score.low { color: var(--muted); }
  a.apply {
    display: inline-block;
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .updated { color: var(--muted); font-size: 0.78rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<header>
  <h1>EntryWay — Job Matches</h1>
  <div class="sub">Entry-level (0–1 yr) Solution Engineering, Solutions Architect &amp; Developer Relations roles</div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="updated" id="updated"></div>
</main>
<script>
  const CATEGORIES = [
    { key: "solution_engineering", label: "Solution Engineering", file: "data/jobs_solution_engineering.csv" },
    { key: "solutions_architect", label: "Solutions Architect", file: "data/jobs_solutions_architect.csv" },
    { key: "developer_relations", label: "Developer Relations", file: "data/jobs_developer_relations.csv" },
  ];

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    const headers = rows[0];
    return rows.slice(1).filter(r => r.length > 1 || r[0]).map(r => {
      const obj = {};
      headers.forEach((h, idx) => obj[h] = r[idx] ?? "");
      return obj;
    });
  }

  function scoreClass(score) {
    const n = parseInt(score, 10);
    if (isNaN(n)) return "low";
    if (n >= 65) return "high";
    if (n >= 45) return "mid";
    return "low";
  }

  function renderTable(jobs) {
    if (!jobs.length) return '<div class="empty">No matches yet in this category — check back after the next run.</div>';
    const sorted = [...jobs].sort((a, b) => (parseInt(b.score, 10) || 0) - (parseInt(a.score, 10) || 0));
    const rows = sorted.map(j => `
      <tr>
        <td>${j.title || ""}</td>
        <td>${j.company || ""}</td>
        <td>${j.location || ""}</td>
        <td class="score ${scoreClass(j.score)}">${j.score || "-"}</td>
        <td>${j.date_found || ""}</td>
        <td>${j.apply_link ? `<a class="apply" href="${j.apply_link}" target="_blank" rel="noopener">Apply</a>` : ""}</td>
      </tr>`).join("");
    return `<div class="table-wrap"><table>
      <thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Score</th><th>Found</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  async function init() {
    const tabsEl = document.getElementById("tabs");
    const panelsEl = document.getElementById("panels");
    const updatedEl = document.getElementById("updated");
    let latest = null;

    const results = await Promise.all(CATEGORIES.map(async cat => {
      try {
        const res = await fetch(cat.file, { cache: "no-store" });
        const text = await res.text();
        const jobs = parseCSV(text);
        jobs.forEach(j => { if (j.date_found && (!latest || j.date_found > latest)) latest = j.date_found; });
        return { ...cat, jobs };
      } catch {
        return { ...cat, jobs: [] };
      }
    }));

    results.forEach((cat, idx) => {
      const tab = document.createElement("button");
      tab.className = "tab" + (idx === 0 ? " active" : "");
      tab.textContent = `${cat.label} (${cat.jobs.length})`;
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(`panel-${cat.key}`).classList.add("active");
      };
      tabsEl.appendChild(tab);

      const panel = document.createElement("div");
      panel.className = "panel" + (idx === 0 ? " active" : "");
      panel.id = `panel-${cat.key}`;
      panel.innerHTML = renderTable(cat.jobs);
      panelsEl.appendChild(panel);
    });

    updatedEl.textContent = latest ? `Last new match found: ${latest}` : "No data yet.";
  }

  init();
</script>
</body>
</html>
