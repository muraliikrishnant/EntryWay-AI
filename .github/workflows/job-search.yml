name: Daily job search

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ollama
      CREWAI_LLM: ollama/gemma4:31b-cloud
      CREWAI_TOOL_LLM: ollama/gpt-oss:20b
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      CLEANJOBDATA: ${{ secrets.CLEANJOBDATA }}
      RESUME_PATH: "data/Muralii_Krishnan_Thirumalai_Resume copy.pdf"
      TOP_N_JOBS: "15"
      SEARCH_LOOKBACK_DAYS: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore tracker/dedupe cache
        uses: actions/cache@v4
        with:
          path: output/
          key: job-tracker-${{ github.run_id }}
          restore-keys: |
            job-tracker-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search
        run: python main.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update job listings [automated]"
          git push
